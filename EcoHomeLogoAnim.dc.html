<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:180},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;loop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;run&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Animation&quot;}}">
class Component extends DCLogic {
  host = null;

  nodes() {
    return this.host ? this.host.querySelectorAll('[data-eh]') : [];
  }

  applySpeed() {
    const s = this.props.speed ?? 1;
    this.nodes().forEach(n => {
      n.style.animationDuration = (n.dataset.eh === 'bob' ? 0.29 / s : 2.5 / s) + 's';
    });
  }

  replay() {
    const host = this.host;
    if (!host) return;
    this.applySpeed();
    let running = [];
    try { running = host.getAnimations({ subtree: true }); } catch (e) { running = []; }
    if (running.length) {
      running.forEach(a => { try { a.cancel(); a.play(); } catch (e) {} });
      return;
    }
    const nodes = this.nodes();
    nodes.forEach(n => { n.style.animationName = 'none'; });
    void host.offsetWidth;
    nodes.forEach(n => { n.style.animationName = ''; });
    this.applySpeed();
  }

  settle() {
    if (!this.host) return;
    try {
      this.host.getAnimations({ subtree: true }).forEach(a => {
        const inf = a.effect && a.effect.getTiming().iterations === Infinity;
        if (inf) a.cancel(); else a.finish();
      });
    } catch (e) {}
  }

  componentDidMount() { this.applySpeed(); this.syncLoop(); this._playedFor = this.props.run; }

  syncLoop() {
    clearInterval(this._loop);
    if (!this.props.loop) return;
    const s = this.props.speed ?? 1;
    this._loop = setInterval(() => this.replay(), (2.5 / s + 1.6) * 1000);
  }

  componentWillUnmount() { clearInterval(this._loop); }

  componentDidUpdate(prev) {
    this.applySpeed();
    if (prev.loop !== this.props.loop || prev.speed !== this.props.speed) this.syncLoop();
    if (prev.run !== this.props.run) { this._playedFor = this.props.run; this.replay(); }
  }

  renderVals() {
    return {
      hostRef: (el) => {
        if (!el || el === this.host) return;
        this.host = el;
        const res = window.__resources;
        if (res) {
          const ids = { 'wm-left.png': 'ehWmLeft', 'wm-right.png': 'ehWmRight', 'icon-steel.png': 'ehIconSteel', 'icon-green.png': 'ehIconGreen' };
          el.querySelectorAll('img').forEach(img => {
            const f = (img.getAttribute('src') || '').split('/').pop();
            if (ids[f] && res[ids[f]]) img.src = res[ids[f]];
          });
        }
        this.applySpeed();
        this.syncLoop();
        const imgs = [...el.querySelectorAll('img')];
        const slot = el.closest('[data-logo-slot]');
        const ready = () => { if (slot) slot.setAttribute('data-ready', '1'); };
        const pending = imgs.filter(i => !i.complete);
        if (pending.length) {
          el.setAttribute('data-wait', '1');
          Promise.all(imgs.map(i => (i.decode ? i.decode() : Promise.resolve()).catch(() => {}))).then(() => {
            el.removeAttribute('data-wait');
            ready();
            this.replay();
          });
        } else {
          ready();
        }
        if (this.props.loop) return;
        const key = this.props.run;
        if (this._playedFor === key) requestAnimationFrame(() => this.settle());
        else this._playedFor = key;
      }
    };
  }
}
